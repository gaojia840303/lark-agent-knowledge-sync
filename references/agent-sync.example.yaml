# 仅用于受控来源的单 Agent MVP，不代表允许公司级全量扫描。
# 已内置来源 API、元数据、正文、候选、提案和时长硬预算；模型 Token 预算在语义阶段接入后另行执行。
agent:
  id: brand-six-elements
  name: 品牌六要素 Agent
  owner: 待配置
  role: 品牌知识参谋
  responsibilities: [维护品牌稳定知识, 识别规则和正式决策变化]
  decision_scope: [品牌知识候选判断, 提交人工审核]
  output_contract: [输出带来源证据的知识提案]
  success_metrics: [预期样例发现率, 审核小修改通过率, 越权读取为零]

knowledge:
  wiki_space_id: 待配置
  public_folder_token: 待配置
  private_folder_token: 待配置
  public_document_token: 待配置
  private_document_token: 待配置

sources:
  meetings:
    # 至少填写业务关键词，并叠加参与人、所有者或固定妙记范围。
    keywords: []
    admission_type: bounded_scan
    source_owner: 待配置
    business_purpose: 发现已确认的品牌规则和决策
    authority_level: approved_decision
    minutes_keywords: []
    participant_ids: []
    owner_ids: []
    minute_tokens: []
    target_scope: private
    knowledge_mode: stable
  documents:
    # 仅配置目标知识库之外的主动提交文档或指定上游共享目录。
    # 搜索必须同时填写 folder_tokens 和 search_keywords，禁止全空间关键词搜索。
    # 个人文档默认不配置；不得重复填写 knowledge.public/private_document_token。
    document_tokens: []
    folder_tokens: []
    admission_type: proactive_submission
    source_owner: 待配置
    business_purpose: 接收负责人主动提交的品牌方法和规则
    authority_level: business_owner
    search_keywords: []
    target_scope: private
    knowledge_mode: stable
  # stable Base 来源必须使用专用 view_id，并设置保守 max_pages。
  bases: []
  # stable Meegle 来源必须使用专用 view_ids 或 mql，禁止整项目读取。
  meegle: []
  fixtures: []

relevance:
  # 搜索型来源至少填写 include_keywords / related_people / related_projects 之一。
  include_keywords: []
  exclude_keywords: []
  related_people: []
  related_projects: []
  max_candidate_chars: 12000

review:
  storage: local
  base_token: 待配置
  tables:
    proposals: 知识变更审核表
    runs: 同步运行表
    cursors: 同步游标表
  reviewers: []

runtime:
  timezone: Asia/Shanghai
  # 回溯窗口不等于调度周期；历史补录使用独立配置和单独预算。
  lookback_days: 7
  lark_cli_path: lark-cli
  meegle_cli_path: meegle
  max_metadata_items: 100
  max_fulltext_items: 20
  max_fulltext_chars: 60000
  max_candidates: 10
  max_proposals: 5
  max_runtime_seconds: 600
  max_source_api_calls: 100
